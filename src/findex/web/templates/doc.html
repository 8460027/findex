<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ doc.title }} — findex</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="/">findex</a></h1>
      <nav class="nav-links">
        <a href="/">&larr; Back to search</a>
        <a href="/docs/{{ doc.doc_id }}">JSON</a>
      </nav>
    </header>

    <h2>{{ doc.title }}</h2>
    <div class="meta-bar">
      Document #{{ doc.doc_id }} &middot; Source: <code>{{ doc.path }}</code> &middot; {{ doc.length }} tokens
    </div>
    <div class="doc-body">{{ doc.text }}</div>
  </div>
</body>
</html>
