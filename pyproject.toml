[project]
name = "findex"
version = "0.7.0"
description = "Memory-efficient streaming search engine with BM25/TF-IDF ranking and rich CLI"
readme = "README.md"
authors = [
    { name = "Р В РЎС™Р В Р’В°Р РЋР вЂљР РЋРІР‚вЂњР РЋР РЏ", email = "8460027@stud.kai.edu.ua" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "selectolax>=1.0.2",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: marks tests that take more than a second (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
